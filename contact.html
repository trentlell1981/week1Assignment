<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Superhero Awesomeness Ratings</title>
  <meta name="description" content="Rate your favorite superheroes and send your own rankings!">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Contact</h1>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="gallery1.html">Gallery1</a>
      <a href="gallery2.html">Gallery2</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h2>My Superhero Awesomeness Ratings</h2>

    <table>
      <tr>
        <th>Hero</th>
        <th>Awesome Factor</th>
      </tr>
      <tr>
        <td>Superman</td>
        <td>7 out of 10</td>
      </tr>
      <tr>
        <td>Wonder Woman</td>
        <td>8 out of 10</td>
      </tr>
      <tr>
        <td>Batman</td>
        <td>6 out of 10</td>
      </tr>
    </table>

    <form>
      <h4>Send Us Your Ratings</h4>
      <input type="text" name="FirstName" placeholder="First Name">
      <input type="text" name="lastName" placeholder="Last Name">
      <label for="superhero">Choose a Superhero:</label>
      <select id="superhero" name="superhero">
        <option value="Superman">Superman</option>
        <option value="Wonder Woman">Wonder Woman</option>
        <option value="Batman">Batman</option>
      </select>
      <input type="submit" value="Submit Rating">
    </form>

    <h2>Superheroes We Will Explore Next Week!</h2>
    <ul>
      <li>Spider-Man</li>
      <li>Black Panther</li>
      <li>Captain Marvel</li>
    </ul>
  </main>
</body>

</html>
